name: Agent patch

on:
  push:
    branches:
      - agent/mcp-streamable-http-e2e

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mcp-streamable-http-e2e
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - name: Wire bounded downloads into file_import
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('packages/windows-worker/src/file-tools.ts')
          s = p.read_text()
          s = s.replace('import { pipeline } from "node:stream/promises";\n', '')
          s = s.replace('import { Readable } from "node:stream";\n', '')
          marker = 'import { asMcpResult } from "./mcp-result.js";\n'
          helper = 'import { downloadResponseToFile } from "./transfer.js";\n'
          if helper not in s:
              if marker not in s:
                  raise SystemExit('mcp-result import marker not found')
              s = s.replace(marker, marker + helper, 1)
          s = s.replace(
              '      if (!response.ok || !response.body) throw new Error(`Download failed with HTTP ${response.status}.`);\n',
              ''
          )
          old_pipeline = '      await pipeline(Readable.fromWeb(response.body as never), fs.createWriteStream(temporary, { flags: "wx" }));\n'
          new_pipeline = '      const bytes = await downloadResponseToFile(response, temporary, runtime.config.limits.maxTransferBytes);\n'
          if old_pipeline in s:
              s = s.replace(old_pipeline, new_pipeline, 1)
          elif new_pipeline not in s:
              raise SystemExit('file_import pipeline marker not found')
          old_return = '      return { destination, file_id: file.file_id, bytes: fs.statSync(destination).size, sha256 };'
          new_return = '      return { destination, file_id: file.file_id, bytes, sha256 };'
          if old_return in s:
              s = s.replace(old_return, new_return, 1)
          elif new_return not in s:
              raise SystemExit('file_import return marker not found')
          p.write_text(s)
          PY
      - run: npm run build -w @mcp-worker/windows-worker
      - run: npm test -w @mcp-worker/windows-worker
      - name: Commit patch
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/windows-worker/src/file-tools.ts
          git commit -m "fix: bound file_import downloads"
          git push origin HEAD:agent/mcp-streamable-http-e2e
