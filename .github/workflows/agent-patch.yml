name: Agent patch

on:
  push:
    branches:
      - agent/mcp-streamable-http-e2e

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mcp-streamable-http-e2e
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - name: Wire bounded downloads into file_import
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('packages/windows-worker/src/file-tools.ts')
          s = p.read_text()
          old_imports = 'import { pipeline } from "node:stream/promises";\nimport { Readable } from "node:stream";\n'
          if old_imports in s:
              s = s.replace(old_imports, '')
          marker = 'import { asMcpResult } from "./mcp-result.js";\n'
          added = marker + 'import { downloadResponseToFile } from "./transfer.js";\n'
          if 'import { downloadResponseToFile } from "./transfer.js";' not in s:
              if marker not in s:
                  raise SystemExit('mcp-result import marker not found')
              s = s.replace(marker, added)
          old = '''      const response = await fetch(file.download_url, { redirect: "follow" });
          if (!response.ok || !response.body) throw new Error(`Download failed with HTTP ${response.status}.`);
          fs.mkdirSync(path.dirname(destination), { recursive: true });
          const temporary = `${destination}.${crypto.randomUUID()}.tmp`;
          await pipeline(Readable.fromWeb(response.body as never), fs.createWriteStream(temporary, { flags: "wx" }));
          const sha256 = await hashFile(temporary);'''
          new = '''      const response = await fetch(file.download_url, { redirect: "follow" });
          fs.mkdirSync(path.dirname(destination), { recursive: true });
          const temporary = `${destination}.${crypto.randomUUID()}.tmp`;
          const bytes = await downloadResponseToFile(response, temporary, runtime.config.limits.maxTransferBytes);
          const sha256 = await hashFile(temporary);'''
          if old in s:
              s = s.replace(old, new)
          elif new not in s:
              raise SystemExit('file_import download block not found')
          old_return = '      return { destination, file_id: file.file_id, bytes: fs.statSync(destination).size, sha256 };'
          new_return = '      return { destination, file_id: file.file_id, bytes, sha256 };'
          if old_return in s:
              s = s.replace(old_return, new_return)
          elif new_return not in s:
              raise SystemExit('file_import return block not found')
          p.write_text(s)
          PY
      - run: npm run build -w @mcp-worker/windows-worker
      - run: npm test -w @mcp-worker/windows-worker
      - name: Commit patch
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/windows-worker/src/file-tools.ts
          git commit -m "fix: bound file_import downloads"
          git push origin HEAD:agent/mcp-streamable-http-e2e
